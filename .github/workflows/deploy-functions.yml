name: Deploy Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify Deploy Started
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: in-progress
          title: "Runaway Edge: Function Deploy Started"
          description: |
            **Commit**: `${{ github.sha }}`
            **Message**: ${{ github.event.head_commit.message }}
          color: 0xF59E0B

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        run: |
          # Get list of all function directories (exclude _shared and import_map.json)
          FUNCTIONS=$(find supabase/functions -maxdepth 1 -mindepth 1 -type d ! -name '_shared' -exec basename {} \;)
          
          echo "Functions to deploy:"
          echo "$FUNCTIONS"
          
          for fn in $FUNCTIONS; do
            echo "Deploying $fn..."
            supabase functions deploy "$fn" \
              --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
              --no-verify-jwt
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Notify Deploy Result
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Runaway Edge: Function Deploy ${{ job.status }}"
          description: |
            **Commit**: `${{ github.sha }}`
            **Result**: ${{ job.status }}
          color: ${{ job.status == 'success' && '0x10B981' || '0xEF4444' }}
