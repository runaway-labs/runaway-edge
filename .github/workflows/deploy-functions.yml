name: Deploy Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        run: |
          # Get list of all function directories (exclude _shared and import_map.json)
          FUNCTIONS=$(find supabase/functions -maxdepth 1 -mindepth 1 -type d ! -name '_shared' -exec basename {} \;)
          
          echo "Functions to deploy:"
          echo "$FUNCTIONS"
          
          for fn in $FUNCTIONS; do
            echo "Deploying $fn..."
            supabase functions deploy "$fn" \
              --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
              --no-verify-jwt
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
