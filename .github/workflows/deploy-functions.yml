name: Deploy Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-functions.yml'
      - 'scripts/audit-deployment.ts'
      - 'scripts/audit-deployment.test.ts'
      - 'supabase/config.toml'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/retired-functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Notify Deploy Started
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: in-progress
          title: "Runaway Edge: Function Deploy Started"
          description: |
            **Commit**: `${{ github.sha }}`
            **Message**: ${{ github.event.head_commit.message }}
          color: 0xF59E0B

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Test fail-closed deployment audit
        run: npx --yes deno test --allow-read scripts/audit-deployment.test.ts

      - name: Download reviewed live bundles
        run: |
          remote_root="$RUNNER_TEMP/runaway-live-before"
          inventory_json="$RUNNER_TEMP/runaway-live-functions.json"
          mkdir -p "$remote_root"
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" --output json > "$inventory_json"
          jq -r '.[].slug' "$inventory_json" | while IFS= read -r function_slug; do
            mkdir -p "$remote_root/$function_slug/supabase"
            cp supabase/config.toml "$remote_root/$function_slug/supabase/config.toml"
            supabase functions download "$function_slug" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --use-api \
              --workdir "$remote_root/$function_slug"
          done
          echo "REMOTE_BUNDLES_BEFORE=$remote_root" >> "$GITHUB_ENV"

      - name: Audit reviewed baseline before deploy
        run: |
          npx --yes deno run --allow-read --allow-env --allow-net \
            scripts/audit-deployment.ts \
            --mode deploy \
            --remote-bundles "$REMOTE_BUNDLES_BEFORE"

      - name: Deploy config-classified edge functions
        run: |
          supabase functions deploy \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --use-api

      - name: Download deployed bundles for verification
        run: |
          remote_root="$RUNNER_TEMP/runaway-live-after"
          inventory_json="$RUNNER_TEMP/runaway-deployed-functions.json"
          mkdir -p "$remote_root"
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" --output json > "$inventory_json"
          jq -r '.[].slug' "$inventory_json" | while IFS= read -r function_slug; do
            mkdir -p "$remote_root/$function_slug/supabase"
            cp supabase/config.toml "$remote_root/$function_slug/supabase/config.toml"
            supabase functions download "$function_slug" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --use-api \
              --workdir "$remote_root/$function_slug"
          done
          echo "REMOTE_BUNDLES_AFTER=$remote_root" >> "$GITHUB_ENV"

      - name: Verify deployed state before retirement
        run: |
          npx --yes deno run --allow-read --allow-env --allow-net \
            scripts/audit-deployment.ts \
            --mode pre \
            --remote-bundles "$REMOTE_BUNDLES_AFTER"

      - name: Notify Deploy Result
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Runaway Edge: Function Deploy ${{ job.status }}"
          description: |
            **Commit**: `${{ github.sha }}`
            **Result**: ${{ job.status }}
          color: ${{ job.status == 'success' && '0x10B981' || '0xEF4444' }}
